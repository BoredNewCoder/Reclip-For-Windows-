<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReClip — Free Media Downloader</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1eb;
      --fg: #3a3a38;
      --accent: #e85d2a;
      --accent-hover: #d04e1f;
      --muted: #9c9889;
      --card: #fff;
      --card-border: #e2ded6;
      --success: #2d8a4e;
      --error: #c43d3d;
      --radius: 14px;
      --shimmer: linear-gradient(90deg, #ebe8e2 25%, #f0ede7 50%, #ebe8e2 75%);
    }
    [data-theme="dark"] {
      --bg: #181816;
      --fg: #e8e5df;
      --accent: #e85d2a;
      --accent-hover: #f06b35;
      --muted: #68675f;
      --card: #222220;
      --card-border: #333330;
      --success: #3ba35e;
      --error: #e05555;
      --shimmer: linear-gradient(90deg, #2a2a28 25%, #303030 50%, #2a2a28 75%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.2s, color 0.2s;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.03;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px;
    }

    .page {
      max-width: 620px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    .brand { margin-bottom: 48px; position: relative; }
    .brand h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 4.2rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--fg);
    }
    .brand h1 em { font-style: italic; color: var(--accent); }
    .brand p {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .theme-toggle {
      position: absolute;
      top: 0; right: 0;
      width: 36px; height: 36px;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .theme-toggle:hover { border-color: var(--fg); color: var(--fg); }
    .theme-toggle svg { width: 15px; height: 15px; }

    textarea {
      width: 100%;
      padding: 18px 20px;
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      outline: none;
      resize: none;
      min-height: 56px;
      max-height: 240px;
      overflow-y: auto;
      transition: border-color 0.25s, box-shadow 0.25s;
      margin-bottom: 6px;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 93, 42, 0.08);
    }
    textarea::placeholder { color: var(--muted); }

    .hint {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .pill-group {
      display: flex;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card);
    }
    .pill {
      padding: 9px 18px;
      font-family: 'DM Mono', monospace;
      font-size: 0.76rem;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .pill.active { background: var(--fg); color: var(--bg); }
    .pill:not(.active):hover { color: var(--fg); }

    .sponsor-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .sponsor-toggle input[type="checkbox"] {
      accent-color: var(--accent);
    }

    .fetch-btn {
      flex: 1;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .fetch-btn:hover { background: var(--accent-hover); }
    .fetch-btn:active { transform: scale(0.98); }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* All your original styles below remain unchanged */
    .card {
      display: flex;
      gap: 14px;
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--card);
      padding: 14px;
      margin-bottom: 10px;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-thumb {
      width: 120px;
      min-width: 120px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--card-border);
      flex-shrink: 0;
      position: relative;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
      border-radius: 8px;
    }
    .card-thumb .no-thumb {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .card-thumb .no-thumb svg {
      width: 28px;
      height: 28px;
      opacity: 0.5;
    }

    .card-thumb.loading {
      background: var(--shimmer);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 4px;
      background: var(--shimmer);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      margin-bottom: 6px;
    }
    .skeleton-line.short { width: 40%; height: 10px; }
    .skeleton-line.medium { width: 75%; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card-title {
      font-family: 'Instrument Serif', serif;
      font-size: 1rem;
      line-height: 1.3;
      color: var(--fg);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-meta {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .card-dl-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 7px;
      background: var(--fg);
      color: var(--bg);
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .card-dl-btn:hover { background: #2d2d2a; }
    .card-dl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .card-dl-btn.done { background: var(--success); color: #fff; }
    .card-dl-btn.error { background: var(--error); color: #fff; }

    .card-status {
      font-size: 0.68rem;
      color: var(--muted);
    }
    .card-status.downloading { color: var(--accent); }
    .card-status.done { color: var(--success); }
    .card-status.error { color: var(--error); }

    .dl-progress {
      width: 100%;
      height: 3px;
      background: var(--card-border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }
    .dl-progress-bar {
      height: 100%;
      width: 40%;
      background: var(--accent);
      border-radius: 2px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0% { transform: translateX(-200%); }
      100% { transform: translateX(350%); }
    }

    .q-chip {
      padding: 4px 10px;
      border: 1.5px solid var(--card-border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .q-chip.active {
      border-color: var(--fg);
      color: var(--fg);
      background: rgba(26,26,24,0.04);
    }
    .q-chip:hover:not(.active) { border-color: var(--muted); }

    .clip-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .clip-row input {
      width: 68px;
      padding: 4px 8px;
      border: 1.5px solid var(--card-border);
      border-radius: 6px;
      background: var(--card);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      outline: none;
      text-transform: none;
    }
    .clip-row input:focus { border-color: var(--accent); }
    .clip-row input.bad { border-color: var(--error); }

    .codec-select {
      padding: 8px 10px;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      background: var(--card);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      cursor: pointer;
      outline: none;
    }
    .codec-select:focus { border-color: var(--accent); }

    .ytdlp-ver {
      width: 100%;
      text-align: center;
      margin-top: 14px;
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .ytdlp-ver button {
      background: none;
      border: none;
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      cursor: pointer;
      letter-spacing: 0.04em;
      padding: 0;
    }
    .ytdlp-ver button:disabled { color: var(--muted); cursor: default; }

    .card.card-error {
      border-color: rgba(196, 61, 61, 0.2);
      background: rgba(196, 61, 61, 0.03);
    }
    .card-error-icon {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(196, 61, 61, 0.08);
      color: var(--error);
    }
    .card-error-icon svg {
      width: 24px;
      height: 24px;
    }
    .card-error-msg {
      font-size: 0.72rem;
      color: var(--error);
      margin-top: 2px;
      line-height: 1.4;
    }
    .card-error-url {
      font-size: 0.65rem;
      color: var(--muted);
      word-break: break-all;
      margin-top: 4px;
    }

    .dl-all-bar {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .dl-all-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--fg);
      color: var(--bg);
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .dl-all-btn:hover { background: #2d2d2a; }
    .dl-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .spin {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 56px 0 24px;
      color: var(--muted);
    }
    .empty-state svg {
      width: 44px; height: 44px;
      opacity: 0.25;
      margin: 0 auto 14px;
      display: block;
    }
    .empty-state p {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .footer {
      margin-top: 48px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .platform-chip {
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 9px;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      transition: border-color 0.2s, color 0.2s;
      text-decoration: none;
    }
    .platform-chip:hover { border-color: var(--muted); color: var(--fg); }

    .cookie-badge {
      position: relative;
      width: 38px;
      height: 38px;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      background: var(--card);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s;
    }
    .cookie-badge:hover { border-color: var(--fg); }
    .cookie-badge.active { border-color: rgba(45,138,78,0.4); }
    .cookie-badge svg { width: 16px; height: 16px; color: var(--muted); }
    .cookie-badge.active svg { color: var(--success); }
    .cookie-badge-dot {
      position: absolute;
      top: 5px; right: 5px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    .cookie-badge.active .cookie-badge-dot { background: var(--success); }

    .cookie-panel {
      display: none;
      margin-top: 8px;
      padding: 12px 14px;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      background: var(--card);
      font-size: 0.72rem;
      color: var(--muted);
    }
    .cookie-panel.open { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .cookie-panel.active {
      border-color: rgba(45,138,78,0.3);
      background: rgba(45,138,78,0.04);
      color: var(--success);
    }
    .cookie-panel-label { flex: 1; }
    .cookie-btn {
      padding: 5px 12px;
      border: 1.5px solid var(--card-border);
      border-radius: 7px;
      background: transparent;
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .cookie-btn:hover { border-color: var(--fg); }
    .cookie-btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .cookie-btn.primary:hover { background: #2d2d2a; }
    .cookie-btn.danger { color: var(--error); border-color: rgba(196,61,61,0.3); }
    .cookie-btn.danger:hover { border-color: var(--error); }
    #cookieUploadInput { display: none; }

    @media (max-width: 500px) {
      .brand h1 { font-size: 3rem; }
      .page { padding: 40px 16px 60px; }
      .card { flex-direction: column; gap: 10px; }
      .card-thumb {
        width: 100%;
        min-width: unset;
        height: 160px;
      }
      .card-title { white-space: normal; }
      .controls { flex-wrap: wrap; }
      .fetch-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark/light mode"></button>
      <h1>Re<em>Clip</em></h1>
      <p>Free media downloader</p>
    </div>

    <textarea id="urls" placeholder="Paste one or more URLs..." rows="2"></textarea>
    <p class="hint">Multiple links? Separate with spaces, commas, or newlines.</p>

    <div class="controls">
      <div class="pill-group">
        <button class="pill active" data-format="video" onclick="setFormat(this)">MP4</button>
        <button class="pill" data-format="audio" onclick="setFormat(this)">MP3</button>
      </div>

      <label class="sponsor-toggle">
        <input type="checkbox" id="sponsorblock" checked>
        Remove Sponsors
      </label>

      <label class="sponsor-toggle">
        <input type="checkbox" id="impersonate">
        Bypass Detection
      </label>

      <label class="sponsor-toggle" id="subsToggleLabel">
        <input type="checkbox" id="subtitles">
        Subtitles (EN)
      </label>

      <select id="codecPref" class="codec-select" title="Preferred video codec (best quality in that codec)">
        <option value="auto">Codec: Auto</option>
        <option value="h264">H.264 (compatible)</option>
        <option value="av1">AV1 (smaller)</option>
        <option value="vp9">VP9</option>
      </select>

      <button class="fetch-btn" id="goBtn" onclick="go()">Fetch</button>

      <button class="cookie-badge" id="cookieBadge" onclick="toggleCookiePanel()" title="Cookie settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="15" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="11" cy="16" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        <span class="cookie-badge-dot"></span>
      </button>
    </div>

    <div id="cookiePanel" class="cookie-panel"></div>

    <div id="cards" class="cards">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="3"/>
          <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/>
        </svg>
        <p>Paste a URL above to get started</p>
      </div>
    </div>

    <div class="footer">
      <a class="platform-chip" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a class="platform-chip" href="https://www.tiktok.com" target="_blank" rel="noopener noreferrer">TikTok</a>
      <a class="platform-chip" href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="platform-chip" href="https://www.x.com" target="_blank" rel="noopener noreferrer">Twitter/X</a>
      <a class="platform-chip" href="https://www.reddit.com" target="_blank" rel="noopener noreferrer">Reddit</a>
      <a class="platform-chip" href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">Facebook</a>
      <a class="platform-chip" href="https://www.vimeo.com" target="_blank" rel="noopener noreferrer">Vimeo</a>
      <a class="platform-chip" href="https://www.twitch.tv" target="_blank" rel="noopener noreferrer">Twitch</a>
      <a class="platform-chip" href="https://www.dailymotion.com" target="_blank" rel="noopener noreferrer">Dailymotion</a>
      <a class="platform-chip" href="https://www.soundcloud.com" target="_blank" rel="noopener noreferrer">SoundCloud</a>
      <a class="platform-chip" href="https://www.loom.com" target="_blank" rel="noopener noreferrer">Loom</a>
      <a class="platform-chip" href="https://www.streamable.com" target="_blank" rel="noopener noreferrer">Streamable</a>
      <a class="platform-chip" href="https://www.pinterest.com" target="_blank" rel="noopener noreferrer">Pinterest</a>
      <a class="platform-chip" href="https://www.tumblr.com" target="_blank" rel="noopener noreferrer">Tumblr</a>
      <a class="platform-chip" href="https://www.threads.net" target="_blank" rel="noopener noreferrer">Threads</a>
      <a class="platform-chip" href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a class="platform-chip" href="https://github.com/yt-dlp/yt-dlp/blob/master/supportedsites.md" target="_blank" rel="noopener noreferrer">1000+ more</a>
    </div>

    <div class="ytdlp-ver" id="ytdlpVer"></div>
  </div>

  <script>
    let currentFormat = 'video';
    let cardData = [];

    // Theme toggle
    const SUN_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
    const MOON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

    function updateThemeIcon() {
      const btn = document.getElementById('themeToggle');
      if (!btn) return;
      btn.innerHTML = document.documentElement.dataset.theme === 'dark' ? SUN_SVG : MOON_SVG;
    }

    function toggleTheme() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      const next = isDark ? 'light' : 'dark';
      document.documentElement.dataset.theme = isDark ? '' : 'dark';
      localStorage.setItem('theme', next);
      updateThemeIcon();
    }

    (function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      } else if (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.dataset.theme = 'dark';
      }
      updateThemeIcon();
    })();

    function setFormat(btn) {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFormat = btn.dataset.format;
    }

    function parseUrls(text) {
      return [...new Set(text.split(/[\s,]+/).map(u => u.trim()).filter(u => u.startsWith('http')))];
    }

    function fmtDur(s) {
      if (!s) return '';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function friendlyError(err) {
      if (err.includes('Unsupported URL')) return 'This URL is not supported';
      if (err.includes('Video unavailable')) return 'Video is unavailable or private';
      if (err.includes('Private video')) return 'This video is private';
      if (err.includes('HTTP Error 403')) return 'Access denied — try adding a cookies.txt file';
      if (err.includes('HTTP Error 404')) return 'Video not found';
      if (err.includes('copyright')) return 'Video blocked due to copyright';
      if (err.includes('geo')) return 'Video not available in your region';
      if (err.includes('timed out') || err.includes('Timed out')) return 'Request timed out — try again';
      if (err.includes('network') || err.includes('Network')) return 'Network error — check your connection';
      if (err.includes('DRM') || err.includes('drm')) return 'DRM-protected — add cookies.txt for age-restricted content';
      if (err.includes('Sign in') || err.includes('login')) return 'Login required — add a cookies.txt file';
      return err.length > 80 ? err.slice(0, 80) + '...' : err;
    }

    const urlsEl = document.getElementById('urls');
    urlsEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
    });
    urlsEl.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
    });

    async function go() {
      const urls = parseUrls(document.getElementById('urls').value);
      if (!urls.length) return;

      const sponsorblock = document.getElementById('sponsorblock').checked;
      const impersonate = document.getElementById('impersonate').checked;

      const btn = document.getElementById('goBtn');
      const container = document.getElementById('cards');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      container.innerHTML = '';
      cardData = [];

      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        const idx = cardData.length;
        cardData.push({ url, status: 'loading' });
        renderCard(idx);

        try {
          const res = await fetch('/api/info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url, impersonate }),
          });
          const data = await res.json();
          if (data.error) {
            cardData[idx] = { ...cardData[idx], status: 'info-error', error: data.error };
          } else {
            cardData[idx] = {
              ...cardData[idx],
              status: 'ready',
              title: data.title || '',
              thumbnail: data.thumbnail || '',
              duration: data.duration,
              uploader: data.uploader || '',
              source: data.source || '',
              formats: data.formats || [],
              selectedFormatId: data.formats?.[0]?.id || null,
            };
          }
        } catch (err) {
          cardData[idx] = { ...cardData[idx], status: 'info-error', error: err.message };
        }
        renderCard(idx);
      }

      if (cardData.filter(c => c.status === 'ready').length > 1) {
        renderDownloadAll();
      }

      btn.disabled = false;
      btn.textContent = 'Fetch';
    }

    function renderCard(idx) {
      const c = cardData[idx];
      let el = document.getElementById(`card-${idx}`);
      if (!el) {
        el = document.createElement('div');
        el.id = `card-${idx}`;
        el.className = 'card';
        document.getElementById('cards').appendChild(el);
      }

      if (c.status === 'loading') {
        el.className = 'card';
        el.innerHTML = `
          <div class="card-thumb loading"></div>
          <div class="card-body">
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
          </div>
        `;
        return;
      }

      if (c.status === 'info-error') {
        el.className = 'card card-error';
        el.innerHTML = `
          <div class="card-thumb">
            <div class="card-error-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title" style="color:var(--error)">Could not fetch video</div>
            <div class="card-error-msg">${esc(friendlyError(c.error || ''))}</div>
            <div class="card-error-url">${esc(c.url)}</div>
          </div>
        `;
        return;
      }

      el.className = 'card';
      const isAudio = currentFormat === 'audio';

      let thumbHtml;
      if (isAudio) {
        thumbHtml = `<div class="no-thumb" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`;
      } else if (c.thumbnail) {
        thumbHtml = `<img src="${c.thumbnail}" alt="">`;
      } else {
        thumbHtml = `<div class="no-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
      }

      const codecPref = document.getElementById('codecPref')?.value || 'auto';
      let qualityChips = '';
      if (!isAudio && c.formats && c.formats.length > 1) {
        if (codecPref !== 'auto') {
          // Codec preference works on the "best available" path only — an explicit
          // quality pick already names the stream. So dim the chips while it's active.
          qualityChips = `<span class="q-chip" style="opacity:.5;pointer-events:none;border-style:dashed">best ${codecPref.toUpperCase()}</span>`;
        } else {
          qualityChips = c.formats.map(f =>
            `<button class="q-chip${f.id === c.selectedFormatId ? ' active' : ''}" data-card-idx="${idx}" data-format-id="${esc(f.id)}">${esc(f.label)}</button>`
          ).join('');
        }
      }

      const clipRow = `
        <div class="clip-row">
          <span>Clip</span>
          <input class="clip-start" data-card-idx="${idx}" placeholder="start" value="${esc(c.clipStart || '')}" aria-label="Clip start time">
          <span>&rarr;</span>
          <input class="clip-end" data-card-idx="${idx}" placeholder="end" value="${esc(c.clipEnd || '')}" aria-label="Clip end time">
          <span style="text-transform:none;letter-spacing:0">mm:ss — optional</span>
        </div>`;

      let actionHtml = '';
      if (c.status === 'ready') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">Download</button>${qualityChips}${clipRow}`;
      } else if (c.status === 'downloading') {
        const progress = c.progress || 0;
        const phaseLabel = c.phase === 'queued' ? 'Queued'
          : c.phase === 'processing' ? 'Processing'
          : `${progress.toFixed(0)}%`;
        const indeterminate = c.phase === 'queued' || c.phase === 'processing';
        actionHtml = `
          <button class="card-dl-btn" onclick="pauseCard(${idx})" style="background:var(--muted);color:var(--bg)">Pause</button>
          <button class="card-dl-btn" onclick="cancelCard(${idx})" style="background:transparent;color:var(--muted);border:1.5px solid var(--card-border)">Cancel</button>
          <span class="card-status downloading"><span class="spin"></span> ${phaseLabel}</span>
          <progress ${indeterminate ? '' : `value="${progress}"`} max="100" style="width:100%;height:4px;border:none;border-radius:2px;margin-top:6px;accent-color:var(--accent)"></progress>
        `;
      } else if (c.status === 'paused') {
        const progress = c.progress || 0;
        actionHtml = `
          <button class="card-dl-btn" onclick="resumeCard(${idx})">Resume</button>
          <button class="card-dl-btn" onclick="cancelCard(${idx})" style="background:transparent;color:var(--muted);border:1.5px solid var(--card-border)">Cancel</button>
          <span class="card-status" style="color:var(--muted)">Paused · ${progress.toFixed(0)}%</span>
          <progress value="${progress}" max="100" style="width:100%;height:4px;border:none;border-radius:2px;margin-top:6px;accent-color:var(--muted)"></progress>
        `;
      } else if (c.status === 'done') {
        actionHtml = `<span class="card-status done">Saved → downloads/${esc(c.filename || '')}</span>`;
      } else if (c.status === 'error') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">Retry</button>
          <span class="card-status error">${esc(friendlyError(c.error || 'Download failed'))}</span>`;
      }

      el.innerHTML = `
        <div class="card-thumb">${thumbHtml}</div>
        <div class="card-body">
          <div class="card-title">${esc(c.title || 'Untitled')}</div>
          <div class="card-meta">${c.source ? esc(c.source) + ' · ' : ''}${c.uploader ? esc(c.uploader) + (c.duration ? ' · ' : '') : ''}${c.duration ? fmtDur(c.duration) : ''}</div>
          <div class="card-actions">${actionHtml}</div>
        </div>
      `;
    }

    function renderDownloadAll() {
      const existing = document.getElementById('dl-all-bar');
      if (existing) existing.remove();

      const bar = document.createElement('div');
      bar.id = 'dl-all-bar';
      bar.className = 'dl-all-bar';
      bar.innerHTML = `<button class="dl-all-btn" onclick="dlAll()">Download All</button>`;
      document.getElementById('cards').appendChild(bar);
    }

    function pickFormat(idx, formatId) {
      cardData[idx].selectedFormatId = formatId;
      renderCard(idx);
    }

    document.getElementById('cards').addEventListener('click', e => {
      if (e.target.classList.contains('q-chip')) {
        const idx = parseInt(e.target.dataset.cardIdx);
        const formatId = e.target.dataset.formatId;
        if (!isNaN(idx)) pickFormat(idx, formatId);
      }
    });

    const TIMECODE_RE = /^(\d{1,2}:)?([0-5]?\d:)?[0-5]?\d(\.\d+)?$|^\d+(\.\d+)?$/;
    document.getElementById('cards').addEventListener('input', e => {
      if (!e.target.classList.contains('clip-start') && !e.target.classList.contains('clip-end')) return;
      const idx = parseInt(e.target.dataset.cardIdx);
      if (isNaN(idx) || !cardData[idx]) return;
      const v = e.target.value.trim();
      e.target.classList.toggle('bad', v !== '' && !TIMECODE_RE.test(v));
      if (e.target.classList.contains('clip-start')) cardData[idx].clipStart = v;
      else cardData[idx].clipEnd = v;
    });

    async function dlCard(idx) {
      const c = cardData[idx];
      c.status = 'downloading';
      c.error = null;
      renderCard(idx);

      const sponsorblock = document.getElementById('sponsorblock').checked;
      const impersonate = document.getElementById('impersonate').checked;
      const subtitles = document.getElementById('subtitles').checked;
      const codec = document.getElementById('codecPref').value;
      // Codec preference only applies on the "best available" path, so drop the explicit
      // quality pick when it's set.
      const formatId = (codec && codec !== 'auto') ? null : c.selectedFormatId;

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: c.url,
            format: currentFormat,
            format_id: formatId,
            title: c.title || '',
            thumbnail: c.thumbnail || '',
            uploader: c.uploader || '',
            source: c.source || '',
            duration: c.duration || null,
            sponsorblock: sponsorblock,
            impersonate: impersonate,
            clip_start: (c.clipStart || '').trim(),
            clip_end: (c.clipEnd || '').trim(),
            subtitles: subtitles,
            codec: codec
          }),
        });
        const data = await res.json();
        if (data.error) {
          c.status = 'error';
          c.error = data.error;
          renderCard(idx);
          return;
        }
        c.jobId = data.job_id;
        pollCard(idx);
      } catch (err) {
        c.status = 'error';
        c.error = err.message;
        renderCard(idx);
      }
    }

    function pollCard(idx) {
      const c = cardData[idx];
      const iv = setInterval(async () => {
        try {
          const res = await fetch(`/api/status/${c.jobId}`);
          const data = await res.json();
          if (data.status === 'done') {
            clearInterval(iv);
            c._poll = null;
            c.status = 'done';
            c.filename = data.filename;
            c.progress = 100;
            renderCard(idx);
          } else if (data.status === 'error') {
            clearInterval(iv);
            c._poll = null;
            c.status = 'error';
            c.error = data.error;
            renderCard(idx);
          } else if (data.status === 'cancelled') {
            clearInterval(iv);
            c._poll = null;
            c.status = 'ready';
            c.progress = 0;
            renderCard(idx);
          } else if (data.status === 'paused') {
            clearInterval(iv);
            c._poll = null;
            c.status = 'paused';
            renderCard(idx);
          } else if (data.status === 'downloading') {
            c.progress = data.progress || 0;
            c.phase = data.phase || null;
            renderCard(idx);
          }
        } catch {
          clearInterval(iv);
          c._poll = null;
          c.status = 'error';
          c.error = 'Lost connection to server';
          renderCard(idx);
        }
      }, 1000);
      c._poll = iv;
    }

    async function pauseCard(idx) {
      const c = cardData[idx];
      if (!c.jobId) return;
      if (c._poll) { clearInterval(c._poll); c._poll = null; }
      try { await fetch(`/api/pause/${c.jobId}`, { method: 'POST' }); } catch {}
      c.status = 'paused';
      renderCard(idx);
    }

    async function resumeCard(idx) {
      const c = cardData[idx];
      if (!c.jobId) return;
      c.status = 'downloading';
      renderCard(idx);
      try {
        const res = await fetch(`/api/resume/${c.jobId}`, { method: 'POST' });
        const data = await res.json();
        if (data.error) {
          c.status = 'error';
          c.error = data.error;
          renderCard(idx);
          return;
        }
        pollCard(idx);
      } catch (err) {
        c.status = 'error';
        c.error = err.message;
        renderCard(idx);
      }
    }

    async function cancelCard(idx) {
      const c = cardData[idx];
      if (!c.jobId) return;
      if (c._poll) { clearInterval(c._poll); c._poll = null; }
      try { await fetch(`/api/cancel/${c.jobId}`, { method: 'POST' }); } catch {}
      c.status = 'ready';
      c.progress = 0;
      renderCard(idx);
    }

    let cookiePanelOpen = false;

    function toggleCookiePanel() {
      cookiePanelOpen = !cookiePanelOpen;
      const panel = document.getElementById('cookiePanel');
      if (cookiePanelOpen) panel.classList.add('open');
      else panel.classList.remove('open');
    }

    async function loadCookieStatus() {
      const badge = document.getElementById('cookieBadge');
      const panel = document.getElementById('cookiePanel');
      try {
        const res = await fetch('/api/cookies/status');
        const data = await res.json();

        panel.innerHTML = '';

        const lbl = document.createElement('span');
        lbl.className = 'cookie-panel-label';

        if (data.active) {
          badge.className = 'cookie-badge active';
          panel.className = cookiePanelOpen ? 'cookie-panel open active' : 'cookie-panel active';
          lbl.textContent = 'Cookies active — age-restricted & subscriber content unlocked';
          panel.appendChild(lbl);
          const clearBtn = document.createElement('button');
          clearBtn.className = 'cookie-btn danger';
          clearBtn.textContent = 'Remove';
          clearBtn.onclick = clearCookies;
          panel.appendChild(clearBtn);
        } else {
          badge.className = 'cookie-badge';
          panel.className = cookiePanelOpen ? 'cookie-panel open' : 'cookie-panel';
          lbl.textContent = 'No cookies — some videos may be blocked';
          panel.appendChild(lbl);
          if (data.firefox_available) {
            const ffBtn = document.createElement('button');
            ffBtn.className = 'cookie-btn primary';
            ffBtn.textContent = 'Import Firefox';
            ffBtn.onclick = importFromFirefox;
            panel.appendChild(ffBtn);
          }
          const newInput = document.createElement('input');
          newInput.type = 'file';
          newInput.id = 'cookieUploadInput';
          newInput.accept = '.txt';
          newInput.style.display = 'none';
          newInput.onchange = () => uploadCookieFile(newInput);
          panel.appendChild(newInput);

          const uploadBtn = document.createElement('button');
          uploadBtn.className = 'cookie-btn';
          uploadBtn.textContent = 'Upload .txt';
          uploadBtn.onclick = () => newInput.click();
          panel.appendChild(uploadBtn);

          const extBtn = document.createElement('a');
          extBtn.className = 'cookie-btn';
          extBtn.textContent = 'Get Extension ↗';
          extBtn.href = 'https://chromewebstore.google.com/detail/get-cookiestxt-locally/cclelndahbckbenkjhflpdbgdldlbecc';
          extBtn.target = '_blank';
          extBtn.rel = 'noopener noreferrer';
          extBtn.style.textDecoration = 'none';
          panel.appendChild(extBtn);
        }
      } catch { /* silently ignore */ }
    }

    async function importFromFirefox() {
      try {
        const res = await fetch('/api/cookies/from-firefox', { method: 'POST' });
        const data = await res.json();
        if (data.error) alert('Import failed: ' + data.error);
        loadCookieStatus();
      } catch {
        alert('Import failed — is the server running?');
      }
    }

    async function uploadCookieFile(input) {
      const file = input.files[0];
      if (!file) return;
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('/api/cookies/upload', { method: 'POST', body: form });
      const data = await res.json();
      if (data.error) alert('Upload failed: ' + data.error);
      input.value = '';
      loadCookieStatus();
    }

    async function clearCookies() {
      await fetch('/api/cookies/clear', { method: 'POST' });
      loadCookieStatus();
    }

    async function dlAll() {
      const btn = document.querySelector('.dl-all-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Downloading...'; }

      const promises = cardData.map((c, i) => cardData[i].status === 'ready' ? dlCard(i) : Promise.resolve());
      await Promise.all(promises);

      if (btn) { btn.disabled = false; btn.textContent = 'Download All'; }
    }

    async function loadActiveJobs() {
      try {
        const res = await fetch('/api/jobs');
        const jobs = await res.json();
        if (!jobs.length) return;

        const container = document.getElementById('cards');
        const emptyState = container.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        for (const job of jobs) {
          const idx = cardData.length;
          cardData.push({
            url: job.url || '',
            status: job.status,
            jobId: job.job_id,
            title: job.title || '',
            thumbnail: job.thumbnail || '',
            uploader: job.uploader || '',
            source: job.source || '',
            duration: job.duration || null,
            progress: job.progress || 0,
            phase: job.phase || null,
          });
          renderCard(idx);
          if (job.status === 'downloading') {
            pollCard(idx);
          }
        }
      } catch {}
    }

    // Re-dim/undim the quality chips when the codec preference changes.
    document.getElementById('codecPref').addEventListener('change', () => {
      cardData.forEach((c, i) => { if (c.status === 'ready') renderCard(i); });
    });

    // yt-dlp version + in-app update
    async function loadYtdlpVersion() {
      const box = document.getElementById('ytdlpVer');
      try {
        const res = await fetch('/api/version');
        const data = await res.json();
        if (!data.yt_dlp) { box.textContent = ''; return; }
        box.innerHTML = `yt-dlp ${esc(data.yt_dlp)} · <button id="ytdlpUpdate">update now</button>`;
        document.getElementById('ytdlpUpdate').onclick = updateYtdlp;
      } catch { box.textContent = ''; }
    }

    async function updateYtdlp() {
      const btn = document.getElementById('ytdlpUpdate');
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = 'updating…';
      try {
        const res = await fetch('/api/update-ytdlp', { method: 'POST' });
        const data = await res.json();
        const box = document.getElementById('ytdlpVer');
        if (data.error) {
          box.innerHTML = `yt-dlp update failed — ${esc(data.error)}`;
        } else {
          box.innerHTML = `yt-dlp ${esc(data.yt_dlp || '')} · updated ✓`;
        }
      } catch {
        document.getElementById('ytdlpVer').textContent = 'yt-dlp update failed — network error';
      }
    }

    // Initialize
    loadCookieStatus();
    loadActiveJobs();
    loadYtdlpVersion();
  </script>
</body>
</html>
